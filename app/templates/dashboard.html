<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoLogMiner - AI 运维工作台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5/index.css">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>

<header>
  <div class="inner">
    <a href="/" class="logo">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 2 4.6 13.2a.6.6 0 0 0 .48.96h5.05l-1 7.5a.6.6 0 0 0 1.07.44L18.99 10.8a.6.6 0 0 0-.48-.96h-5.05l1-7.5a.6.6 0 0 0-1.07-.44Z"/></svg></span>
      AutoLogMiner
    </a>
    <nav>
      <a href="/" class="active">仪表盘</a>
      <a href="/servers">服务器</a>
      <a href="/diagnose">日志诊断</a>
      <a href="/alerts">告警</a>
      <a href="/timeline">时间线</a>
      <a href="/knowledge">知识库</a>
      <a href="/history">历史记录</a>
      <a href="/providers">供应商</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="dash-summary" id="dash-summary">
    <div class="dash-stat-skeleton" aria-hidden="true"><span class="sk-kpi-label"></span><span class="sk-kpi-value"></span></div>
    <div class="dash-stat-skeleton" aria-hidden="true"><span class="sk-kpi-label"></span><span class="sk-kpi-value"></span></div>
    <div class="dash-stat-skeleton" aria-hidden="true"><span class="sk-kpi-label"></span><span class="sk-kpi-value"></span></div>
    <div class="dash-stat-skeleton" aria-hidden="true"><span class="sk-kpi-label"></span><span class="sk-kpi-value"></span></div>
  </div>
  <div class="dash-toolbar">
    <h2>服务器概览</h2>
    <div class="toolbar-group">
      <button class="btn btn-outline btn-sm btn-refresh" onclick="refreshDashboard()">刷新</button>
      <label class="dash-toolbar-label"><input type="checkbox" id="auto-refresh" onchange="toggleAutoRefresh()"> 自动刷新</label>
      <button class="btn btn-outline btn-sm" onclick="seedDemo(this)">演示数据</button>
      <button class="btn btn-outline btn-sm" id="btn-reset-demo">重置演示数据</button>
      <button class="btn btn-primary btn-sm" onclick="batchHealthCheck(this)">全部检测</button>
    </div>
  </div>
  <div class="server-grid" id="server-grid">
    <div class="skeleton-card" aria-hidden="true"><span class="sk-line sk-title"></span><span class="sk-line sk-meta"></span><div class="sk-metrics"><span></span><span></span><span></span></div><div class="sk-chart"></div></div>
    <div class="skeleton-card" aria-hidden="true"><span class="sk-line sk-title"></span><span class="sk-line sk-meta"></span><div class="sk-metrics"><span></span><span></span><span></span></div><div class="sk-chart"></div></div>
    <div class="skeleton-card" aria-hidden="true"><span class="sk-line sk-title"></span><span class="sk-line sk-meta"></span><div class="sk-metrics"><span></span><span></span><span></span></div><div class="sk-chart"></div></div>
  </div>

  <div id="alerts-section" class="dash-alerts-section"></div>
</main>

<footer>AutoLogMiner &mdash; AI 驱动的运维工作台</footer>
<div id="toast" class="toast"></div>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/servers.js"></script>
<script src="/static/js/diagnose.js"></script>
<script src="/static/js/alerts.js"></script>
<script src="/static/js/timeline.js"></script>
<script src="/static/js/knowledge.js"></script>
<script src="/static/js/demo.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
