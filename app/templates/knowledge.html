<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库 - AutoLogMiner</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5/index.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="inner">
    <a href="/" class="logo">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 2 4.6 13.2a.6.6 0 0 0 .48.96h5.05l-1 7.5a.6.6 0 0 0 1.07.44L18.99 10.8a.6.6 0 0 0-.48-.96h-5.05l1-7.5a.6.6 0 0 0-1.07-.44Z"/></svg></span>
      AutoLogMiner
    </a>
    <nav>
      <a href="/">仪表盘</a>
      <a href="/servers">服务器</a>
      <a href="/diagnose">日志诊断</a>
      <a href="/alerts">告警</a>
      <a href="/timeline">时间线</a>
      <a href="/knowledge" class="active">知识库</a>
      <a href="/history">历史记录</a>
      <a href="/providers">供应商</a>
    </nav>
  </div>
</header>
<main class="container">
  <div class="card">
    <div class="card-header">
      <h2>运维知识库</h2>
      <div class="toolbar-group">
        <input type="file" id="kn-file-input" class="kn-file-input" accept=".md" onchange="uploadKnowledge()">
        <button class="btn btn-primary" onclick="document.getElementById('kn-file-input').click()">+ 上传 .md 文件</button>
      </div>
    </div>
    <p class="desc">知识库中的 Markdown 文件会在日志诊断时自动注入到 AI 提示词中，提升诊断准确率。</p>
    <div id="knowledge-list"><div class="spinner active"></div></div>
  </div>
</main>
<footer>AutoLogMiner &mdash; AI 驱动的运维工作台</footer>
<div id="toast" class="toast"></div>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/servers.js"></script>
<script src="/static/js/diagnose.js"></script>
<script src="/static/js/alerts.js"></script>
<script src="/static/js/timeline.js"></script>
<script src="/static/js/knowledge.js"></script>
<script src="/static/js/demo.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
