<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务器详情 - AutoLogMiner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5/index.css">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>

<header>
  <div class="inner">
    <a href="/" class="logo">
      <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 2 4.6 13.2a.6.6 0 0 0 .48.96h5.05l-1 7.5a.6.6 0 0 0 1.07.44L18.99 10.8a.6.6 0 0 0-.48-.96h-5.05l1-7.5a.6.6 0 0 0-1.07-.44Z"/></svg></span>
      AutoLogMiner
    </a>
    <nav>
      <a href="/">仪表盘</a>
      <a href="/servers" class="active">服务器</a>
      <a href="/diagnose">日志诊断</a>
      <a href="/alerts">告警</a>
      <a href="/timeline">时间线</a>
      <a href="/knowledge">知识库</a>
      <a href="/history">历史记录</a>
      <a href="/providers">供应商</a>
    </nav>
  </div>
</header>

<main class="container page-server-detail">
  <div class="page-back"><a href="/servers">&larr; 返回服务器列表</a></div>

  <div class="card" id="server-info-card">
    <div class="spinner active"></div>
  </div>

  <div class="card detail-card">
    <div class="card-header">
      <h2>健康检查</h2>
      <button class="btn btn-primary" id="btn-health-check" onclick="runHealthCheck()">执行健康检查</button>
    </div>
    <div id="health-result">
      <p class="empty">点击上方按钮执行健康检查</p>
    </div>
  </div>

  <div class="card detail-card">
    <h2 class="card-title">24 小时趋势</h2>
    <div class="chart-container">
      <canvas id="trend-chart"></canvas>
    </div>
  </div>

  <div class="card detail-card">
    <h2 class="card-title">调度与告警</h2>
    <div class="settings-grid">
      <div class="setting-group">
        <label>定时检查间隔（分钟）</label>
        <input type="number" id="sched-interval" value="0" min="0" placeholder="0 = 关闭">
        <span class="setting-hint">设为 5 表示每 5 分钟自动检查一次</span>
      </div>
      <div class="setting-group">
        <label>CPU 告警阈值 (%)</label>
        <input type="number" id="alert-cpu" value="0" min="0" max="100" placeholder="0 = 关闭">
      </div>
      <div class="setting-group">
        <label>内存告警阈值 (%)</label>
        <input type="number" id="alert-mem" value="0" min="0" max="100" placeholder="0 = 关闭">
      </div>
      <div class="setting-group">
        <label>磁盘告警阈值 (%)</label>
        <input type="number" id="alert-disk" value="0" min="0" max="100" placeholder="0 = 关闭">
      </div>
      <div class="setting-group setting-group-full">
        <label>Webhook URL（钉钉/飞书）</label>
        <input type="text" id="webhook-url" placeholder="https://oapi.dingtalk.com/robot/send?access_token=...">
      </div>
    </div>
    <button class="btn btn-primary settings-save" onclick="saveSettings()">保存设置</button>
  </div>

  <div class="card detail-card">
    <h2>远程日志 &amp; 诊断</h2>
    <div class="log-toolbar">
      <select id="log-type" onchange="toggleLogInput()">
        <option value="journalctl">journalctl (系统日志)</option>
        <option value="file">指定文件路径</option>
      </select>
      <input type="text" id="log-unit" class="log-unit-input" placeholder="服务名 (如 nginx)">
      <input type="text" id="log-path" class="log-path-input" placeholder="/var/log/nginx/error.log" hidden>
      <input type="number" id="log-lines" class="log-lines-input" value="200" title="行数">
      <button class="btn btn-outline" onclick="fetchLog()">获取日志</button>
      <button class="btn btn-primary" onclick="inlineDiagnose()" id="btn-inline-dx">AI 诊断</button>
    </div>
    <pre id="log-content">点击上方按钮获取日志</pre>
    <div id="dx-result" class="dx-result"></div>
  </div>
</main>

<footer>AutoLogMiner &mdash; AI 驱动的运维工作台</footer>
<div id="toast" class="toast"></div>
<script>
const SERVER_ID = {{ server_id }};
</script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/servers.js"></script>
<script src="/static/js/diagnose.js"></script>
<script src="/static/js/alerts.js"></script>
<script src="/static/js/timeline.js"></script>
<script src="/static/js/knowledge.js"></script>
<script src="/static/js/demo.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
